<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f0f;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #e5e5e5;
    }

    .card {
      width: 100%;
      max-width: 360px;
      padding: 2rem;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: #a3a3a3;
    }

    input[type="password"] {
      width: 100%;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      color: #f5f5f5;
      background: #0f0f0f;
      border: 1px solid #333;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="password"]:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }

    input[type="password"]::placeholder {
      color: #525252;
    }

    button {
      width: 100%;
      margin-top: 1.25rem;
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
      background: #6366f1;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover {
      background: #4f46e5;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
        margin-top: 1rem;
        font-size: 0.875rem;
        text-align: center;
        min-height: 1.25rem;
        color: #e5e5e5;          /* white-ish */
        }

    .status.error {
        color: #f8c971;          /* only errors are red */
    }

    .status.success {
      color: #4ade80;
    }
  </style>
</head>
<body>
  <div class="card">
    <form id="password-form">
      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="Enter password"
        autocomplete="current-password"
        required
      >
      <button type="submit" id="submit-btn">Submit</button>
      <div class="status" id="status"></div>
    </form>
  </div>

  <script>
  const form = document.getElementById("password-form");
  const passwordInput = document.getElementById("password");
  const submitBtn = document.getElementById("submit-btn");
  const statusEl = document.getElementById("status");

  // Placeholder that Python replaces
  const ENDPOINT = "__ENDPOINT__/login";

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const password = passwordInput.value;
    if (!password) return;

    submitBtn.disabled = true;
    statusEl.textContent = "Sending…";
    statusEl.className = "status";          // white by default

    try {
      const res = await fetch(ENDPOINT, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ password })
      });

      const text = await res.text();        // read the plaintext response
      statusEl.textContent = text || "(empty response)";
      statusEl.className = "status";        // keep it white
    } catch (err) {
      statusEl.textContent = "Network error";
      statusEl.className = "status error";  // only errors stay red
      console.error(err);
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
